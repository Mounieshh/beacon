name: Beacon AI Autonomous Fixer

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_body:
        description: "Test Issue Body content"
        required: false
        default: "Fix formatting in types/globals.d.ts\n\n<!-- BEACON_METADATA_START\n{\n  \"version\": 1,\n  \"activeFile\": \"types/globals.d.ts\"\n}\nBEACON_METADATA_END -->"
      issue_number:
        description: "Issue number for test"
        required: false
        default: "1"

concurrency:
  group: beacon-fix-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  resolve-issue:
    # Restrict execution to when beacon-ai-fix label is applied or via manual dispatch
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'beacon-ai-fix' &&
       (github.event.issue.author_association == 'OWNER' ||
        github.event.issue.author_association == 'COLLABORATOR' ||
        github.event.issue.author_association == 'MEMBER'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Fix Branch
        run: |
          BRANCH="beacon/fix-issue-${{ github.event.inputs.issue_number || github.event.issue.number }}"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git push -u origin "$BRANCH"

      - name: Prepare Aider Prompt
        id: prompt
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const title = (context.payload?.issue?.title || 'Autonomous Bug Fix').replace(/["`$\\]/g, ' ');
            const rawBody = context.payload?.inputs?.issue_body || context.payload?.issue?.body || '';
            const cleanBody = rawBody.replace(/["`$\\]/g, ' ').replace(/\r?\n/g, ' ');
            return `--yes --message "Fix the reported issue in this codebase. Title: ${title}. Details: ${cleanBody}. Ensure changes compile cleanly."`;

      - name: Run Aider via Marketplace Action
        uses: mirrajabi/aider-github-action@v1.1.0
        timeout-minutes: 10
        with:
          model: 'openrouter/nvidia/nemotron-3.5-lightning:free'
          api_key_env_name: 'OPENROUTER_API_KEY'
          api_key_env_value: ${{ secrets.OPENROUTER_API_KEY }}
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          branch: "beacon/fix-issue-${{ github.event.inputs.issue_number || github.event.issue.number }}"
          aider_args: ${{ steps.prompt.outputs.result }}

      - name: Pull Aider Fix to Runner
        run: |
          BRANCH="beacon/fix-issue-${{ github.event.inputs.issue_number || github.event.issue.number }}"
          git pull origin "$BRANCH"

      - name: Verify Fix Types & Compilation
        run: |
          pnpm exec tsc --noEmit

      - name: Open Draft Pull Request
        id: cpr
        uses: actions/github-script@v7
        with:
          script: |
            const issueNum = context.issue.number || Number(context.payload?.inputs?.issue_number);
            const branchName = `beacon/fix-issue-${issueNum}`;
            const { owner, repo } = context.repo;

            const pulls = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${branchName}`
            });

            if (pulls.data.length > 0) {
              const existingPr = pulls.data[0];
              console.log(`PR #${existingPr.number} already exists.`);
              core.setOutput('pull-request-number', existingPr.number);
              return;
            }

            const issueTitle = context.payload?.issue?.title || 'Manual Dispatch Fix';
            const pr = await github.rest.pulls.create({
              owner,
              repo,
              title: `🤖 Fix: ${issueTitle}`,
              head: branchName,
              base: 'main',
              body: [
                `Resolves #${issueNum}`,
                '',
                '### Automated Changes',
                'Fix generated by **Aider Chat Action** (`mirrajabi/aider-github-action`) using `nvidia/nemotron-3.5-lightning:free` via OpenRouter.',
                '- [x] TypeScript compiler verified (`tsc --noEmit`)',
                '- [x] Sandboxed CI verification passed'
              ].join('\n'),
              draft: true
            });

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: pr.data.number,
              labels: ['beacon-ai', 'automated-pr']
            });

            core.setOutput('pull-request-number', pr.data.number);

      - name: Post Feedback Comment on Issue
        if: steps.cpr.outputs.pull-request-number && (github.event.issue.number || github.event.inputs.issue_number)
        uses: actions/github-script@v7
        with:
          script: |
            const issueNum = context.issue.number || Number(context.payload?.inputs?.issue_number);
            if (issueNum) {
              await github.rest.issues.createComment({
                issue_number: issueNum,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `🚀 **Beacon AI Agent** has resolved this issue using Aider (\`nvidia/nemotron-3.5-lightning:free\`) and opened draft pull request #${{ steps.cpr.outputs.pull-request-number }} with passing typechecks.`
              });
            }
