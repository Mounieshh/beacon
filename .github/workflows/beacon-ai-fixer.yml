name: Beacon AI Autonomous Fixer

on:
  issues:
    types: [opened, labeled]

jobs:
  resolve-issue:
    # Restrict automated execution to issues with 'beacon-ai-fix' opened/approved by repo collaborators
    if: >-
      contains(github.event.issue.labels.*.name, 'beacon-ai-fix') &&
      (github.event.issue.author_association == 'OWNER' ||
       github.event.issue.author_association == 'COLLABORATOR' ||
       github.event.issue.author_association == 'MEMBER')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Gemini AI Fixer
        id: fixer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          npx tsx scripts/resolve-issue-gemini.ts

      - name: Verify Fix Types & Compilation
        run: |
          pnpm exec tsc --noEmit

      - name: Create Draft Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "fix: resolve issue #${{ github.event.issue.number }} via Beacon Agent"
          branch: "beacon/fix-issue-${{ github.event.issue.number }}"
          title: "🤖 Fix: ${{ github.event.issue.title }}"
          body: |
            Resolves #${{ github.event.issue.number }}

            ### Automated Changes
            Fix generated and verified by **Beacon AI Agent** (Gemini).
            - [x] TypeScript compiler verified (`tsc --noEmit`)
            - [x] Sandboxed CI verification passed
          labels: "beacon-ai, automated-pr"
          draft: true

      - name: Post Feedback Comment on Issue
        if: steps.cpr.outputs.pull-request-number
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Beacon AI Agent** has resolved this issue and opened draft pull request #${{ steps.cpr.outputs.pull-request-number }} with passing typechecks.`
            });
