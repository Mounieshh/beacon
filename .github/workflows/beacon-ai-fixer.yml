name: Beacon AI Autonomous Fixer

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      issue_body:
        description: "Test Issue Body content"
        required: false
        default: "Fix formatting in types/globals.d.ts\n\n<!-- BEACON_METADATA_START\n{\n  \"version\": 1,\n  \"activeFile\": \"types/globals.d.ts\"\n}\nBEACON_METADATA_END -->"
      issue_number:
        description: "Issue number for test"
        required: false
        default: "1"

concurrency:
  group: beacon-fix-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  resolve-issue:
    # Restrict execution to when beacon-ai-fix label is present or via manual dispatch
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.issue.labels.*.name, 'beacon-ai-fix') &&
       (github.event.issue.author_association == 'OWNER' ||
        github.event.issue.author_association == 'COLLABORATOR' ||
        github.event.issue.author_association == 'MEMBER'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Aider
        run: pipx install aider-chat

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Prepare Fix Branch
        run: |
          BRANCH="beacon/fix-issue-${{ github.event.inputs.issue_number || github.event.issue.number }}"
          git checkout -B "$BRANCH"

      - name: Prepare Aider Inputs
        id: prep
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = context.payload?.issue?.title || 'Autonomous Bug Fix';
            const body = context.payload?.inputs?.issue_body || context.payload?.issue?.body || '';

            let activeFile = '';
            const match = body.match(/<!-- BEACON_METADATA_START([\s\S]*?)BEACON_METADATA_END -->/);
            if (match && match[1]) {
              try {
                const meta = JSON.parse(match[1].trim());
                if (meta.activeFile && fs.existsSync(meta.activeFile)) {
                  activeFile = meta.activeFile;
                }
              } catch (e) {
                console.log('Error parsing metadata:', e);
              }
            }

            const prompt = `Fix the reported issue in this codebase.
Title: ${title}
Details:
${body}

Instructions:
1. Search and identify the exact files and components in the repository related to this issue (e.g. headers, navigation, layouts, or pages).
2. If an active file is provided as context, use it as a reference point, but inspect shared components (like components/ or app/) if the feature is defined elsewhere.
3. Apply targeted, concrete diff edits to resolve the request. Do not ask interactive questions in CI mode.
4. Ensure all changes pass TypeScript compilation cleanly.`;
            fs.writeFileSync('/tmp/aider-prompt.txt', prompt, 'utf8');

            core.setOutput('active_file', activeFile);

      - name: Run Aider with Auto Build & Type Error Resolution
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ACTIVE_FILE: ${{ steps.prep.outputs.active_file }}
        run: |
          AIDER_EXTRA_ARGS=""
          if [ -n "$ACTIVE_FILE" ]; then
            AIDER_EXTRA_ARGS="--file $ACTIVE_FILE"
          fi
          aider \
            --model openrouter/nvidia/nemotron-3.5-lightning:free \
            --edit-format diff \
            --map-tokens 512 \
            --cache-prompts \
            --test-cmd "pnpm exec tsc --noEmit" \
            --auto-test \
            --yes-always \
            --no-pretty \
            --no-stream \
            --no-analytics \
            --message-file /tmp/aider-prompt.txt \
            $AIDER_EXTRA_ARGS

      - name: Push Fix Branch
        id: push_step
        run: |
          BRANCH="beacon/fix-issue-${{ github.event.inputs.issue_number || github.event.issue.number }}"
          # Stage and commit any unstaged edits if Aider left them uncommitted
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "fix: resolve issue #${{ github.event.inputs.issue_number || github.event.issue.number }} via Beacon Agent"
          fi

          # Compare with origin/main to verify new commits exist
          COMMITS_AHEAD=$(git rev-list --count origin/main..HEAD || echo "0")
          echo "commits_ahead=$COMMITS_AHEAD" >> $GITHUB_OUTPUT

          if [ "$COMMITS_AHEAD" -gt 0 ]; then
            git push -u origin "$BRANCH" --force
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "No commits were generated by the AI agent."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Verify Fix Types & Compilation
        if: steps.push_step.outputs.has_changes == 'true'
        run: |
          pnpm exec tsc --noEmit

      - name: Open Draft Pull Request
        id: cpr
        if: steps.push_step.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNum = context.issue.number || Number(context.payload?.inputs?.issue_number);
            const branchName = `beacon/fix-issue-${issueNum}`;
            const { owner, repo } = context.repo;

            const pulls = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${branchName}`
            });

            if (pulls.data.length > 0) {
              const existingPr = pulls.data[0];
              console.log(`PR #${existingPr.number} already exists.`);
              core.setOutput('pull-request-number', existingPr.number);
              return;
            }

            const issueTitle = context.payload?.issue?.title || 'Manual Dispatch Fix';
            const pr = await github.rest.pulls.create({
              owner,
              repo,
              title: `🤖 Fix: ${issueTitle}`,
              head: branchName,
              base: 'main',
              body: [
                `Resolves #${issueNum}`,
                '',
                '### Automated Changes',
                'Fix generated by **Beacon AI Agent** (Aider + OpenRouter `nvidia/nemotron-3.5-lightning:free`).',
                '- [x] Automated typecheck-and-repair loop verified',
                '- [x] TypeScript compiler verified (`tsc --noEmit`)',
                '- [x] Sandboxed CI verification passed'
              ].join('\n'),
              draft: true
            });

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: pr.data.number,
              labels: ['beacon-ai', 'automated-pr']
            });

            core.setOutput('pull-request-number', pr.data.number);

      - name: Post Feedback Comment on Issue
        if: steps.cpr.outputs.pull-request-number && (github.event.issue.number || github.event.inputs.issue_number)
        uses: actions/github-script@v7
        with:
          script: |
            const issueNum = context.issue.number || Number(context.payload?.inputs?.issue_number);
            if (issueNum) {
              await github.rest.issues.createComment({
                issue_number: issueNum,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `🚀 **Beacon AI Agent** has resolved this issue using Aider (\`nvidia/nemotron-3.5-lightning:free\`) and opened draft pull request #${{ steps.cpr.outputs.pull-request-number }} with passing typechecks.`
              });
            }

      - name: Post Clarification Comment on Issue
        if: steps.push_step.outputs.has_changes == 'false' && (github.event.issue.number || github.event.inputs.issue_number)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issueNum = context.issue.number || Number(context.payload?.inputs?.issue_number);
            if (!issueNum) return;

            let agentResponse = '';
            if (fs.existsSync('.aider.chat.history.md')) {
              const history = fs.readFileSync('.aider.chat.history.md', 'utf8');
              const entries = history.split('#### ');
              if (entries.length > 1) {
                agentResponse = entries[entries.length - 1].trim();
              }
            }

            const body = agentResponse
              ? `ℹ️ **Beacon AI Agent** analyzed the codebase for this issue but did not apply code changes. Feedback from agent:\n\n> ${agentResponse.replace(/\r?\n/g, '\n> ')}`
              : `ℹ️ **Beacon AI Agent** analyzed the codebase for this issue but did not find the targeted code to modify. Please provide additional component or file pointers.`;

            await github.rest.issues.createComment({
              issue_number: issueNum,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
