name: Beacon AI Autonomous Fixer

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_body:
        description: "Test Issue Body content"
        required: false
        default: "Fix formatting in types/globals.d.ts\n\n<!-- BEACON_METADATA_START\n{\n  \"version\": 1,\n  \"activeFile\": \"types/globals.d.ts\"\n}\nBEACON_METADATA_END -->"
      issue_number:
        description: "Issue number for test"
        required: false
        default: "1"

concurrency:
  group: beacon-fix-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  resolve-issue:
    # Restrict execution to when beacon-ai-fix label is applied or via manual dispatch
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'beacon-ai-fix' &&
       (github.event.issue.author_association == 'OWNER' ||
        github.event.issue.author_association == 'COLLABORATOR' ||
        github.event.issue.author_association == 'MEMBER'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Aider
        run: pipx install aider-chat

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Prepare Fix Branch
        run: |
          BRANCH="beacon/fix-issue-${{ github.event.inputs.issue_number || github.event.issue.number }}"
          git checkout -B "$BRANCH"

      - name: Prepare Aider Prompt File
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = context.payload?.issue?.title || 'Autonomous Bug Fix';
            const body = context.payload?.inputs?.issue_body || context.payload?.issue?.body || '';
            const prompt = `Fix the reported issue in this codebase.\nTitle: ${title}\nDetails:\n${body}\n\nInstructions:\n1. Locate and inspect the relevant files.\n2. Edit the files to fix the issue.\n3. Ensure all changes pass TypeScript compilation cleanly.`;
            fs.writeFileSync('/tmp/aider-prompt.txt', prompt, 'utf8');

      - name: Run Aider with Auto Build & Type Error Resolution
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          aider \
            --model openrouter/nvidia/nemotron-3.5-lightning:free \
            --test-cmd "pnpm exec tsc --noEmit" \
            --auto-test \
            --yes-always \
            --no-pretty \
            --no-stream \
            --no-analytics \
            --message-file /tmp/aider-prompt.txt

      - name: Push Fix Branch
        run: |
          BRANCH="beacon/fix-issue-${{ github.event.inputs.issue_number || github.event.issue.number }}"
          # Stage and commit any unstaged edits if Aider left them uncommitted
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "fix: resolve issue #${{ github.event.inputs.issue_number || github.event.issue.number }} via Beacon Agent"
          fi
          git push -u origin "$BRANCH" --force

      - name: Verify Fix Types & Compilation
        run: |
          pnpm exec tsc --noEmit

      - name: Open Draft Pull Request
        id: cpr
        uses: actions/github-script@v7
        with:
          script: |
            const issueNum = context.issue.number || Number(context.payload?.inputs?.issue_number);
            const branchName = `beacon/fix-issue-${issueNum}`;
            const { owner, repo } = context.repo;

            const pulls = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${branchName}`
            });

            if (pulls.data.length > 0) {
              const existingPr = pulls.data[0];
              console.log(`PR #${existingPr.number} already exists.`);
              core.setOutput('pull-request-number', existingPr.number);
              return;
            }

            const issueTitle = context.payload?.issue?.title || 'Manual Dispatch Fix';
            const pr = await github.rest.pulls.create({
              owner,
              repo,
              title: `🤖 Fix: ${issueTitle}`,
              head: branchName,
              base: 'main',
              body: [
                `Resolves #${issueNum}`,
                '',
                '### Automated Changes',
                'Fix generated by **Beacon AI Agent** (Aider + OpenRouter `nvidia/nemotron-3.5-lightning:free`).',
                '- [x] Automated typecheck-and-repair loop verified',
                '- [x] TypeScript compiler verified (`tsc --noEmit`)',
                '- [x] Sandboxed CI verification passed'
              ].join('\n'),
              draft: true
            });

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: pr.data.number,
              labels: ['beacon-ai', 'automated-pr']
            });

            core.setOutput('pull-request-number', pr.data.number);

      - name: Post Feedback Comment on Issue
        if: steps.cpr.outputs.pull-request-number && (github.event.issue.number || github.event.inputs.issue_number)
        uses: actions/github-script@v7
        with:
          script: |
            const issueNum = context.issue.number || Number(context.payload?.inputs?.issue_number);
            if (issueNum) {
              await github.rest.issues.createComment({
                issue_number: issueNum,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `🚀 **Beacon AI Agent** has resolved this issue using Aider (\`nvidia/nemotron-3.5-lightning:free\`) and opened draft pull request #${{ steps.cpr.outputs.pull-request-number }} with passing typechecks.`
              });
            }
